name: Keep Supabase projects active

on:
  schedule:
    # Runs every day at 03:17 UTC, safely before the 7-day inactivity limit.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping-supabase-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase projects
        env:
          PROJECT_1_URL: ${{ secrets.SUPABASE_PROJECT_1_URL }}
          PROJECT_1_KEY: ${{ secrets.SUPABASE_PROJECT_1_ANON_KEY }}
          PROJECT_2_URL: ${{ secrets.SUPABASE_PROJECT_2_URL }}
          PROJECT_2_KEY: ${{ secrets.SUPABASE_PROJECT_2_ANON_KEY }}
          PROJECT_3_URL: ${{ secrets.SUPABASE_PROJECT_3_URL }}
          PROJECT_3_KEY: ${{ secrets.SUPABASE_PROJECT_3_ANON_KEY }}
        run: |
          set -euo pipefail

          ping_project() {
            name="$1"
            url="$2"
            key="$3"

            if [ -z "$url" ]; then
              echo "$name is not configured. Add its URL secret."
              return 1
            fi

            url="${url%/}"
            echo "Pinging $name..."
            curl_args=()
            if [ -n "$key" ]; then
              auth_header=$(printf 'Authorization: %s %s' "Bearer" "$key")
              curl_args=(-H "apikey: $key" -H "$auth_header")
            fi

            status_code=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 30 \
              "${curl_args[@]}" \
              "$url/rest/v1/") || {
              echo "$name ping request failed before receiving an HTTP response."
              return 1
            }

            if [ "$status_code" = "000" ]; then
              echo "$name did not return a valid HTTP status."
              return 1
            fi

            echo "$name responded with HTTP $status_code."
          }

          ping_project "Project 1" "$PROJECT_1_URL" "$PROJECT_1_KEY"
          ping_project "Project 2" "$PROJECT_2_URL" "$PROJECT_2_KEY"
          ping_project "Project 3" "$PROJECT_3_URL" "$PROJECT_3_KEY"
